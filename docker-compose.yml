version: '3.3'

services:
  bot:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ~/.aws:/root/.aws:ro
      - type: bind
        source: ./serif-list.csv
        target: /serif-list.csv

  go:
    env_file:
      - .env
    image: golang:1.23-alpine
    volumes:
      - ~/.aws:/root/.aws:ro
      - .:/app
    working_dir: /app
    stdin_open: true 
    tty: true  
